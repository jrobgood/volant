name: Volant
options:
  bundleIdPrefix: com.mysticcoders
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: REMBT6JY4N
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "0.2.4"
    CURRENT_PROJECT_VERSION: "12"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
packages:
  VolantCore:
    path: Core
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  Volant:
    type: application
    platform: macOS
    sources:
      - path: Volant
        excludes: ["Resources/config.example.json", "Resources/HelloWorld"]
      - path: Volant/Resources/HelloWorld
        type: folder
        buildPhase: resources
      - path: Shared
    entitlements:
      path: Volant/Volant.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.personal-information.addressbook: true
        com.apple.security.personal-information.calendars: true
        com.apple.security.device.bluetooth: true
        com.apple.security.device.audio-input: true
        com.apple.security.personal-information.location: true
        # Restart, Shut Down and Log Out ask loginwindow to show its own confirmation dialog.
        # Measured in docs/system-actions-spike.md: no Automation prompt results.
        com.apple.security.automation.apple-events: true
        com.apple.security.temporary-exception.apple-events:
          - com.apple.loginwindow
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - com.apple.airportd
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
    info:
      path: Volant/Info.plist
      properties:
        CFBundleName: Volant
        CFBundleDisplayName: Volant
        CFBundleIdentifier: com.mysticcoders.volant
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SUFeedURL: $(VOLANT_UPDATE_FEED_URL)
        SUPublicEDKey: $(VOLANT_UPDATE_PUBLIC_KEY)
        SUEnableInstallerLauncherService: true
        SUEnableDownloaderService: true
        LSUIElement: true
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "Copyright 2026 Mystic Coders, LLC"
        NSPrincipalClass: NSApplication
        NSContactsUsageDescription: "Volant searches your contacts so you can copy an email address or phone number. Read-only."
        NSBluetoothAlwaysUsageDescription: "Volant lists connected Bluetooth devices when you open the Bluetooth command."
        NSBluetoothPeripheralUsageDescription: "Volant lists connected Bluetooth devices on request."
        NSLocationWhenInUseUsageDescription: "macOS requires Location access to show Wi-Fi network names. Volant does not request your coordinates."
        NSLocationUsageDescription: "macOS requires Location access to show Wi-Fi network names. Volant does not request your coordinates."
        NSCalendarsFullAccessUsageDescription: "Volant shows today's events and their meeting links. Read-only."
        NSMicrophoneUsageDescription: "Volant transcribes dictation on this Mac. Audio is never sent anywhere and is not saved."
        NSAppleEventsUsageDescription: "Volant asks macOS to show its restart, shut down and log out confirmations when you choose those commands."
    dependencies:
      - package: VolantCore
      - package: Sparkle
      - target: VolantExtensionHost
        embed: true
      - target: VolantAgentHost
        embed: true
      - target: VolantAIHost
        embed: true
      - target: VolantRatesHost
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mysticcoders.volant
        PROVISIONING_PROFILE_SPECIFIER: $(VOLANT_PROVISIONING_PROFILE)
        PRODUCT_NAME: Volant
        PRODUCT_MODULE_NAME: Volant
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        VOLANT_UPDATE_FEED_URL: https://usevolant.com/updates/appcast.xml
        VOLANT_UPDATE_PUBLIC_KEY: "iygB/kS8RY5Jh1g/IkvPRHy47iXRWqFR71jJCz9oTgY="
  VolantExtensionHost:
    type: xpc-service
    platform: macOS
    sources:
      - path: VolantExtensionHost
      - path: Shared
    dependencies:
      - package: VolantCore
    entitlements:
      path: VolantExtensionHost/VolantExtensionHost.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.cs.allow-jit: true
    info:
      path: VolantExtensionHost/Info.plist
      properties:
        CFBundleIdentifier: com.mysticcoders.volant.ExtensionHost
        CFBundleName: VolantExtensionHost
        XPCService:
          ServiceType: Application
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mysticcoders.volant.ExtensionHost
        GENERATE_INFOPLIST_FILE: NO
  VolantAIHost:
    type: xpc-service
    platform: macOS
    sources:
      - path: VolantAIHost
    dependencies:
      - package: VolantCore
    entitlements:
      path: VolantAIHost/VolantAIHost.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    info:
      path: VolantAIHost/Info.plist
      properties:
        CFBundleIdentifier: com.mysticcoders.volant.AIHost
        CFBundleName: VolantAIHost
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        XPCService:
          ServiceType: Application
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mysticcoders.volant.AIHost
        GENERATE_INFOPLIST_FILE: NO
  VolantRatesHost:
    type: xpc-service
    platform: macOS
    sources:
      - path: VolantRatesHost
    dependencies:
      - package: VolantCore
    entitlements:
      path: VolantRatesHost/VolantRatesHost.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    info:
      path: VolantRatesHost/Info.plist
      properties:
        CFBundleIdentifier: com.mysticcoders.volant.RatesHost
        CFBundleName: VolantRatesHost
        XPCService:
          ServiceType: Application
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mysticcoders.volant.RatesHost
        GENERATE_INFOPLIST_FILE: NO
  VolantAgentHost:
    type: xpc-service
    platform: macOS
    sources:
      - path: VolantAgentHost
      - path: Shared/HerdrProcess.swift
      - path: Shared/HerdrQuestion.swift
      - path: Shared/HerdrClaudeQuestion.swift
      - path: Shared/HerdrCodexApproval.swift
      - path: Shared/HerdrResponseController.swift
    dependencies:
      - package: VolantCore
    info:
      path: VolantAgentHost/Info.plist
      properties:
        CFBundleIdentifier: com.mysticcoders.volant.AgentHost
        CFBundleName: VolantAgentHost
        XPCService:
          ServiceType: Application
          JoinExistingSession: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mysticcoders.volant.AgentHost
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: NO
  VolantTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: VolantTests
      - path: Shared
    dependencies:
      - target: Volant
      # The host app already links the static core; linking it here duplicates the library.
      - package: VolantCore
        link: false
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Volant.app/Contents/MacOS/Volant"
        PRODUCT_BUNDLE_IDENTIFIER: com.mysticcoders.volant.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Volant:
    build:
      targets:
        Volant: all
        VolantTests: [test]
    run:
      config: Debug
    test:
      environmentVariables:
        VOLANT_UNIT_TESTING: "1"
      config: Debug
      targets: [VolantTests]
