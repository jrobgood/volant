# Fork only: runs the VolantCore package tests, which the PR checks do not run, and repeats the
# native checks with their output in the job log, since the PR checks write it to an artifact.
name: Core tests (fork)
on:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - shell: bash {0}
        run: |
          swift test --package-path Core > /tmp/core.log 2>&1
          status=$?
          grep -E "error:|failed|Test Suite '.*(ACP|Worktree|Workspace).*' (passed|failed)|Executed [0-9]+ tests" /tmp/core.log | tail -150
          if [ $status -ne 0 ]; then echo "---- last 100 lines ----"; tail -100 /tmp/core.log; fi
          exit $status
  native-log:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: brew install xcodegen swiftlint
      - run: |
          python3 -m venv /tmp/volant-ci-python
          /tmp/volant-ci-python/bin/pip install cryptography
      - name: Native checks with visible output
        env:
          VOLANT_TEST_PYTHON: /tmp/volant-ci-python/bin/python
        shell: bash {0}
        run: |
          Scripts/test.sh --ci --ui never > /tmp/native.log 2>&1
          status=$?
          grep -E "error:|warning: .*(ACP|Conversation|Workspace|Worktree|Herdr)|Passed|Test Suite '.*(ACP|Conversation|Workspace|Worktree|Herdr).*' (passed|failed)|Executed [0-9]+ tests|\*\* TEST|failed" /tmp/native.log | tail -150
          if [ $status -ne 0 ]; then echo "---- last 200 lines ----"; tail -200 /tmp/native.log; fi
          exit $status
